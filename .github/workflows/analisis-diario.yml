# Análisis diario del clima de San Juan (Python + pandas).
# Descarga los 365 días de temperaturas del SMN, actualiza el histórico y
# datos/estadisticas.json. El push dispara el despliegue automático de Hostinger.
name: Análisis diario del clima
on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 de San Juan, después de que el SMN publica el día anterior
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analisis-diario
  cancel-in-progress: false
jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analisis/requirements.txt
      - run: pip install -r analisis/requirements.txt
      - name: Calcular estadísticas
        run: python analisis/calcular.py
      - name: Guardar y publicar si hubo cambios
        run: |
          git config user.name "Análisis diario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Estadísticas del $(date -u +%d/%m/%Y)"
            git push
          fi

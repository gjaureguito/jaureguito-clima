name: Sondeo de datos abiertos del SMN
on: workflow_dispatch
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar archivos de datos abiertos
        run: |
          for dato in regtemp tiepre datohorario obs pron5d estaciones; do
            echo "===== $dato ====="
            curl -sSL -o "$dato.zip" -w "HTTP %{http_code} %{size_download} bytes\n" "https://ssl.smn.gob.ar/dpd/zipopendata.php?dato=$dato" || true
            if unzip -l "$dato.zip" >/dev/null 2>&1; then
              unzip -l "$dato.zip"
              unzip -p "$dato.zip" | iconv -f latin1 -t utf-8 | head -6
              echo "--- San Juan:"
              unzip -p "$dato.zip" | iconv -f latin1 -t utf-8 | grep -i "san juan" | head -5
              echo "--- lineas: $(unzip -p "$dato.zip" | wc -l)"
            else
              head -c 300 "$dato.zip"; echo
            fi
          done
